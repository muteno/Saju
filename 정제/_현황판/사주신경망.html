<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>사주 신경망 — 판단이 흐르는 층</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04060d;color:#cfe0f5;
  font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;cursor:grab}
#cv.drag{cursor:grabbing}
.panel{position:fixed;background:rgba(8,13,26,.93);border:1px solid #22304a;
  border-radius:10px;backdrop-filter:blur(8px);font-size:12px;line-height:1.55}
#ctl{top:12px;left:12px;padding:12px 14px;width:246px;max-height:calc(100vh - 24px);overflow:auto}
#ctl h1{font-size:14px;color:#fff;margin-bottom:2px;letter-spacing:.02em}
#ctl .sub{color:#6d82a3;font-size:11px;margin-bottom:10px}
.grp{border-top:1px solid #1b2740;padding-top:9px;margin-top:9px}
.grp b{display:block;color:#8fa8cc;font-size:11px;margin-bottom:6px;letter-spacing:.04em}
label{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;color:#b9cbe6}
label:hover{color:#fff}
input[type=checkbox]{accent-color:#4a86e8;width:13px;height:13px}
input[type=range]{width:100%;accent-color:#4a86e8}
.sw{width:22px;height:3px;border-radius:2px;flex:none}
.cnt{margin-left:auto;color:#5b6f8f;font-size:10px}
button{background:#16233c;border:1px solid #2a3c5c;color:#b9cbe6;border-radius:6px;
  padding:5px 9px;font-size:11px;cursor:pointer;font-family:inherit}
button:hover{background:#1e2f4e;color:#fff}
button.on{background:#2b4674;border-color:#4a86e8;color:#fff}
#info{top:12px;right:12px;padding:13px 15px;width:330px;max-height:calc(100vh - 24px);
  overflow:auto;display:none}
#info h2{font-size:15px;color:#fff;margin-bottom:3px}
#info .path{color:#6d82a3;font-size:11px;margin-bottom:9px}
#info .def{border-left:2px solid #4a86e8;padding:7px 10px;background:#0c1626;
  border-radius:0 6px 6px 0;margin-bottom:10px;color:#dce9fa;font-size:12px}
#info .def .who{display:block;color:#6d82a3;font-size:10.5px;margin-top:5px}
#info .row{display:flex;gap:6px;align-items:baseline;padding:2.5px 0;border-bottom:1px solid #121d31}
#info .row .nm{color:#dce9fa}
#info .row .meta{margin-left:auto;color:#5b6f8f;font-size:10px;white-space:nowrap}
#info .sec{color:#8fa8cc;font-size:11px;margin:10px 0 4px;letter-spacing:.04em}
#tip{position:fixed;pointer-events:none;background:#0b1424;border:1px solid #2a3c5c;
  border-radius:6px;padding:6px 9px;font-size:11.5px;color:#dce9fa;display:none;z-index:9}
#hint{bottom:12px;left:12px;padding:8px 12px;color:#5b6f8f;font-size:11px}
kbd{background:#16233c;border:1px solid #2a3c5c;border-radius:3px;padding:0 4px;font-size:10px}
</style></head><body>
<canvas id="cv"></canvas>

<div class="panel" id="ctl">
  <h1>사주 신경망</h1>
  <div class="sub">개념 <b id="nN"></b> · 시냅스 <b id="eN"></b> · 층 10</div>

  <div class="grp"><b>시냅스 층</b><div id="tierBox"></div></div>

  <div class="grp"><b>최소 강도 <span id="wv" style="color:#4a86e8">0.00</span></b>
    <input type="range" id="wmin" min="0" max="0.9" step="0.05" value="0">
  </div>

  <div class="grp"><b>보기</b>
    <label><input type="checkbox" id="lbl" checked> 개념 이름</label>
    <label><input type="checkbox" id="glow" checked> 발광(가산 합성)</label>
    <label><input type="checkbox" id="fwd"> 진행 방향만 (역방향 숨김)</label>
  </div>

  <div class="grp"><b>대주제</b><div id="bigBox" style="max-height:190px;overflow:auto"></div></div>

  <div class="grp" style="display:flex;gap:6px;flex-wrap:wrap">
    <button id="fit">전체 맞춤</button><button id="reset">선택 해제</button>
  </div>
</div>

<div class="panel" id="info"></div>
<div id="tip"></div>
<div class="panel" id="hint">
  마우스 올리면 그 뉴런의 시냅스만 빛난다 · <kbd>클릭</kbd> 고정 · <kbd>휠</kbd> 확대 · <kbd>드래그</kbd> 이동 · 층 머리를 클릭하면 접힌다
</div>

<script>

 "d": "정제", "q": "한 오행이 다음 오행을 낳아 힘을 실어주는 관계. 목→화→토→금→수→목으로 돌며, 낳는 쪽은 기운이 빠지고 받는 쪽은 힘을 얻는다.", "deg": 66}, {"n": "고립·불급", "L": 0, "k": 6, "big": "S01 음양·오행", "mid": "오행 관계", "code": "S01", "col": "#e8543f", "p": 1880, "au": 17, "d": "정제", "q": "한 오행이 없거나 지나치게 약한 상태. 원국에 아예 없으면 무재·무관처럼 부르며, 충으로 깨져 홀로 남은 경우도 포함한다.", "deg": 45}, {"n": "과다·태과", "L": 0, "k": 7, "big": "S01 음양·오행", "mid": "오행 관계", "code": "S01", "col": "#e8543f", "p": 1373, "au": 16, "d": "정제", "q": "한 오행이 지나치게 많아 균형이 깨진 상태. 그 기운이 극하는 오행이 손상되고, 지나침은 모자람과 같은 결과를 낳는다.", "deg": 62}, {"n": "상극", "L": 0, "k": 8, "big": "S01 음양·오행", "mid": "오행 관계", "code": "S01", "col": "#e8543f", "p": 1239, "au": 17, "d": "정제", "q": "한 오행이 다른 오행을 눌러 제어하는 관계. 목→토→수→화→금→목으로 돌며, 무조건 나쁜 것이 아니라 균형을 잡는 작용이기도 하다.", "deg": 55}, {"n": "설기", "L": 0, "k": 9, "big": "S01 음양·오행", "mid": "오행 관계", "code": "S01", "col": "#e8543f", "p": 373, "au": 13, "d": "정제", "q": "자기 기운이 다음 오행을 낳느라 빠져나가는 것. 기운이 지나치게 많을 때는 덜어내는 통로가 되어 오히려 이롭다.", "deg": 77}, {"n": "음양", "L": 0, "k": 10, "big": "S01 음양·오행", "mid": "음양론", "code": "S01", "col": "#e8543f", "p": 3035, "au": 16, "d": "정제", "q": "모든 것을 서로 맞선 두 기운으로 나눠 보는 관점. 명리를 비롯한 동양 이론 전체의 바탕이며, 오행은 여기서 갈라져 나온 것이다.", "deg": 60}, {"n": "체용론", "L": 0, "k": 11, "big": "S01 음양·오행", "mid": "음양론", "code": "S01", "col": "#e8543f", "p": 76, "au": 9, "d": "정제", "q": "하나의 대상을 본체(體)와 쓰임(用) 두 측면으로 나눠 보는 사고방식. 명리에서는 사·오·해·자처럼 겉 성질과 실제 쓰임이 어긋나는 글자를 설명할 때 쓴다.", "deg": 53}, {"n": "양팔통·음팔통", "L": 0, "k": 12, "big": "S01 음양·오행", "mid": "음양론", "code": "S01", "col": "#e8543f", "p": 26, "au": 7, "d": "정제", "q": "여덟 글자가 모두 양간지이거나(양팔통) 모두 음간지인(음팔통) 사주. 기운이 한쪽으로 쏠려 성향이 뚜렷하게 드러난다.", "deg": 14}, {"n": "지지(총칭)", "L": 0, "k": 13, "big": "S14 기본 골격어", "mid": "골격", "code": "S14", "col": "#8a94a6", "p": 7309, "au": 17, "d": "정제", "q": "자·축·인·묘·진·사·오·미·신·유·술·해 열두 글자를 통틀어 이르는 말. 땅의 기운이자 현실·환경을 나타낸다.", "deg": 122}, {"n": "오행(총칭)", "L": 0, "k": 14, "big": "S14 기본 골격어", "mid": "골격", "code": "S14", "col": "#8a94a6", "p": 5727, "au": 17, "d": "정제", "  "#f0912f", "p": 4670, "au": 17, "d": "정제", "q": "양의 수. 바다처럼 크게 흐르는 기운으로 지혜·유연함·빠른 두뇌 회전을 나타낸다.", "deg": 57}, {"n": "경금(庚)", "L": 1, "k": 2, "big": "S02 천간", "mid": "양간 5", "code": "S02", "col": "#f0912f", "p": 4264, "au": 17, "d": "정제", "q": "양의 금. 아직 제련되지 않은 쇠붙이·바위 같은 기운으로 결단·원칙·강직함을 나타낸다.", "deg": 71}, {"n": "무토(戊)", "L": 1, "k": 3, "big": "S02 천간", "mid": "양간 5", "code": "S02", "col": "#f0912f", "p": 4066, "au": 16, "d": "정제", "q": "양의 토. 끝없이 펼쳐진 대지 같은 기운으로 포용·중심·버팀을 나타낸다.", "deg": 65}, {"n": "갑목(甲)", "L": 1, "k": 4, "big": "S02 천간", "mid": "양간 5", "code": "S02", "col": "#f0912f", "p": 1595, "au": 15, "d": "정제", "q": "천간의 첫 글자이자 양의 목. 언 땅을 뚫고 곧게 솟는 기운으로 시작·추진·우두머리 성향을 나타낸다.", "deg": 107}, {"n": "신금(辛)", "L": 1, "k": 5, "big": "S02 천간", "mid": "음간 5", "code": "S02", "col": "#f0912f", "p": 4907, "au": 16, "d": "정제", "q": "음의 금. 가공을 거친 보석·연장 같은 기운으로 예리함·정교함·자존을 나타낸다.", "deg": 81}, {"n": "정화(丁)", "L": 1, "k": 6, "big": "S02 천간", "mid": "음간 5", "code": "S02", "col": "#f0912f", "p": 4663, "au": 16, "d": "정제", "q": "음의 화. 열을 머금은 촛불 같은 기운으로 집중·세심함·은근함을 나타낸다.", "deg": 56}, {"n": "을목(乙)", "L": 1, "k": 7, "big": "S02 천간", "mid": "음간 5", "code": "S02", "col": "#f0912f", "p": 4123, "au": 16, "d": "정제", "q": "음의 목. 화초·넝쿨처럼 굽어 자라는 기운으로 적응·유연함·끈질김을 나타낸다.", "deg": 56}, {"n": "기토(己)", "L": 1, "k": 8, "big": "S02 천간", "mid": "음간 5", "code": "S02", "col": "#f0912f", "p": 3230, "au": 16, "d": "정제", "q": "음의 토. 밭의 흙처럼 길러내는 기운으로 실속·수용·꼼꼼함을 나타낸다.", "deg": 52}, {"n": "계수(癸)", "L": 1, "k": 9, "big": "S02 천간", "mid": "음간 5", "code": "S02", "col": "#f0912f", "p": 1952, "au": 15, "d": "정제", "q": "음의 수. 이슬비·시냇물 같은 작고 맑은 기운으로 분별·섬세함·스며듦을 나타낸다.", "deg": 84}, {"n": "병존", "L": 1, "k": 10, "big": "S02 천간", "mid": "천간 이론", "code": "S02", "col": "#f0912f", "p": 371, "au": 13, "d": "정제", "q": "같은 글자가 사주 안에 나란히 놓인 것. 그 기운이 배가되어 성향이 크게 증폭된다.", "deg": 59}, {"n": "적천수 천간론", "L": 1, "k": 11, "big": "S02 천간", "mid": "천간 이론", "code": "S02", "col": "#f0912f", "p": 207, "au": 12, "d": "정제", "q": "고전 『적천수』가 천 06", "col": "#2fb99b", "p": 44, "au": 12, "d": "정제", "q": "배우자 자리가 비거나 외로워지는 흉신. 남자는 고신, 여자는 과숙으로 나눠 부른다.", "deg": 45}, {"n": "탕화", "L": 4, "k": 59, "big": "S06 신살", "mid": "흉신", "code": "S06", "col": "#2fb99b", "p": 28, "au": 7, "d": "정제", "q": "끓는 물이나 불에 데는 일을 뜻하는 흉신. 화상·중독·급한 사고로 읽는다.", "deg": 11}, {"n": "천문성", "L": 4, "k": 60, "big": "S06 신살", "mid": "흉신", "code": "S06", "col": "#2fb99b", "p": 26, "au": 9, "d": "정제", "q": "술·해를 비롯한 특정 지지에 붙는 이름. 천라지망의 천라와 겹치는 글자이며 종교·철학·학문 쪽 자리로 다룬다. 어느 글자까지 넣는지는 판본이 갈린다(사화만 보는 쪽과 술·해·미·묘까지 넣는 쪽).", "deg": 21}, {"n": "급각살", "L": 4, "k": 61, "big": "S06 신살", "mid": "흉신", "code": "S06", "col": "#2fb99b", "p": 11, "au": 4, "d": "정제", "q": "몸의 손상, 특히 다리·관절과 낙상을 살피는 자리로 쓰이는 신살. 곡각살·탕화살과 같은 묶음에서 다룬다.", "deg": 2}, {"n": "함지살", "L": 4, "k": 62, "big": "S06 신살", "mid": "흉신", "code": "S06", "col": "#2fb99b", "p": 9, "au": 5, "d": "정제", "q": "도화살의 다른 이름. 다만 도화가 있는 기둥의 삼합국 오행이 그 기둥의 납음오행과 같아야 성립한다고 보는 판본이 있어, 그 경우 도화살보다 조건이 좁다.", "deg": 4}, {"n": "부성입묘", "L": 4, "k": 63, "big": "S06 신살", "mid": "흉신", "code": "S06", "col": "#2fb99b", "p": 0, "au": 0, "d": "정제", "q": "여자 사주에서 관성이 묘(墓)에 해당하는 자리에 든 것. 관성을 남편 자리로 보는 육친 배속과, 묘를 갈무리·잠김으로 보는 십이운성 배속이 겹쳐 성립한다.", "deg": 1}, {"n": "제왕", "L": 4, "k": 64, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 542, "au": 14, "d": "정제", "q": "십이운성의 다섯째 단계. 기운이 가장 왕성한 정점으로 힘과 고집이 함께 극에 이른다.", "deg": 60}, {"n": "관대", "L": 4, "k": 65, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 398, "au": 15, "d": "정제", "q": "십이운성의 셋째 단계. 옷을 갖춰 입는 때로 자기 주장이 서고 사회에 나서는 기운을 뜻한다.", "deg": 44}, {"n": "목욕", "L": 4, "k": 66, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 393, "au": 15, "d": "정제", "q": "십이운성의 둘째 단계. 씻기고 다듬어지는 때로 불안정함과 멋 부림을 뜻한다.", "deg": 47}, {"n": "장생", "L": 4, "k": 67, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 359, "au": 13, "d": "정제", "q": "십이운성의 첫 단계. 갓 태어난 상태로 순수하고 자라나는 기운을 뜻한다.", "deg": 60}, {"n": "절·태·양", "L": 4, "k": 68, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 304, "au": 13, "d": "정제", "q": "십이운성의 마지막 세 단계. 끊기고(절) 잉태되고(태) 길러지는(양) 때로, 여기서 다시 장생으로 이어져 고리가 닫힌다.", "deg": 53}, {"n": "쇠", "L": 4, "k": 69, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 248, "au": 13, "d": "정제", "q": "십이운성의 여섯째 단계. 정점을 지나 기울기 시작하는 때로 노련함과 물러섬을 뜻한다.", "deg": 67}, {"n": "건록", "L": 4, "k": 70, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 154, "au": 12, "d": "정제", "q": "십이운성의 넷째 단계. 제 몫을 벌어 자립하는 때로 안정된 힘을 뜻한다.", "deg": 83}, {"n": "묘(입묘)", "L": 4, "k": 71, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 68, "au": 9, "d": "정제", "q": "십이운성의 아홉째 단계. 창고에 들어가 갈무리되는 때로 저장·잠복·마무리를 뜻한다.", "deg": 57}, {"n": "병·사", "L": 4, "k": 72, "big": "S07 십이운성", "mid": "12단계", "code": "S07", "col": "#31b0d4", "p": 64, "au": 4, "d": "정제", "q": "십이운성의 일곱째·여덟째 단계. 기운이 약해지고(병) 멎는(사) 때로 내면화·정리를 뜻한다.", "deg": 56}, {"n": "십이운성 자체", "L": 4, "k": 73, "big": "S07 십이운성", "mid": "이론·논쟁", "code": "S07", "col": "#31b0d4", "p": 570, "au": 12, "d": "정제", "q": "천간이 각 지지에서 얼마나 힘을 쓰는지를 열두 단계로 나타낸 것. 일간과 지지 두 값이 있어야 정해지는 두 항 함수다.", "deg": 95}, {"n": "포태법", "L": 4, "k": 74, "big": "S07 십이운성", "mid": "이론·논쟁", "code": "S07", "col": "#31b0d4", "p": 41, "au": 9, "d": "정제", "q": "천간이 열두 지지에서 겪는 기운의 세기를 태어나 자라고 스러지는 열두 단계로 매기는 법. 십이운성을 산출하는 규칙이다.", "deg": 29}, {"n": "음간 십이운성", "L": 4, "k": 75, "big": "S07 십이운성", "mid": "이론·논쟁", "code": "S07", "col": "#31b0d4", "p": 5, "au": 2, "d": "정제", "q": "음간의 십이운성을 어떻게 매길 것인가의 문제. 양간과 반대로 거꾸로 돌린다는 쪽, 양간을 그대로 따른다는 쪽, 아예 인정하지 않는 쪽으로 관점이 갈린다.", "deg": 4}, {"n": "폐기론(현묘)", "L": 4, "k": 76, "big": "S07 십이운성", "mid": "이론·논쟁", "code": "S07", "col": "#31b0d4", "p": 2, "au": 2, "d": "정제", "q": "십이운성을 관법에서 아예 빼야 한다는 관점. 오행의 이치와 어긋나고 실제 판단에 보탬이 안 된다고 본다.", "deg": 1}, {"n": "신약", "L": 5, "k": 0, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 1577, "au": 17, "d": "정제", "q": "일간이 자기를 돕는 기운을 얻지 못해 힘이 약한 상태. 다룰 대상은 많은데 다룰 힘이 모자란 구조가 된다.", "deg": 74}, {"n": "신강", "L": 5, "k": 1, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 1108, "au": 16, "d": "정제", "q": "일간이 자기를 돕는 기운을 넉넉히 얻어 힘이 강한 상태. 비겁과 인성이 많거나 계절의 도움을 받은 경우다.", "deg": 87}, {"n": "중화", "L": 5, "k": 2, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 346, "au": 16, "d": "정제", "q": "어느 한쪽으로 치우치지 않고 균형이 잡힌 상태. 명리가 좋게 보는 기본 지향점이다.", "deg": 67}, {"n": "득령·득지·득세", "L": 5, "k": 3, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 238, "au": 13, "d": "정제", "q": "일간이 힘을 얻는 세 갈래. 태어난 달의 도움을 받으면 득령, 앉은 자리에 뿌리를 두면 득지, 나머지 자리에서 세력을 얻으면 득세다.", "deg": 65}, {"n": "신왕", "L": 5, "k": 4, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 212, "au": 10, "d": "정제", "q": "일간의 기운이 왕성한 상태. 신강과 붙여 쓰지만, 계절의 도움을 받았는지 뿌리를 두었는지로 갈라 보기도 한다.", "deg": 60}, {"n": "극신약", "L": 5, "k": 5, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 101, "au": 11, "d": "정제", "q": "일간을 돕는 기운이 거의 없는 상태. 지장간에까지 비겁 뿌리가 없거나 있어도 제 역할을 못 하는 경우를 이른다. 신약과의 경계도 겹치는 띠이며 절단점은 잠정치다.", "deg": 50}, {"n": "극신강", "L": 5, "k": 6, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 88, "au": 6, "d": "정제", "q": "일간을 돕는 기운(비겁·인성)이 지나치게 몰린 상태. 억부에서는 기운을 빼거나 눌러 주는 쪽을 쓴다. 신강과의 경계는 선이 아니라 겹치는 띠이고, 흔히 쓰는 절단점은 표본이 얇은 잠정치다.", "deg": 36}, {"n": "점수론(110점)", "L": 5, "k": 7, "big": "S08 강약·격국·구조", "mid": "강약", "code": "S08", "col": "#4a86e8", "p": 9, "au": 2, "d": "정제", "q": "여덟 글자에 자리별 배점을 매겨 오행의 세력을 숫자로 재는 방법. 개수만 세지 않고 자리의 무게를 반영해 강약을 가른다.", "deg": 16}, {"n": "격국 일반", "L": 5, "k": 8, "big": "S08 강약·격국·구조", "mid": "격국", "code": "S08", "col": "#4a86e8", "p": 615, "au": 13, "d": "정제", "q": "사주가 어떤 틀로 짜였는지를 이름 붙인 것. 주로 월지를 기준으로 삼아 그 사주의 성격과 쓰임을 규정한다.", "deg": 77}, {"n": "종격", "L": 5, "k": 9, "big": "S08 강약·격국·구조", "mid": "격국", "code": "S08", "col": "#4a86e8", "p": 231, "au": 12, "d": "정제", "q": "일간이 너무 약해 자기를 지키지 못하고 강한 쪽에 따라가는 틀. 따라가는 대상에 따라 종재·종살 등으로 나뉜다.", "deg": 54}, {"n": "전왕격", "L": 5, "k": 10, "big": "S08 강약·격국·구조", "mid": "격국", "code": "S08", "col": "#4a86e8", "p": 109, "au": 4, "d": "정제", "q": "한 오행이 압도적으로 강해 거스르지 않고 그대로 따라가는 틀. 누르면 오히려 탈이 난다고 본다.", "deg": 50}, {"n": "특수격", "L": 5, "k": 11, "big": "S08 강약·격국·구조", "mid": "격국", "code": "S08", "col": "#4a86e8", "p": 67, "au": 11, "d": "정제", "q": "정격에 들지 않는 드문 틀을 통틀어 이르는 말. 인정 여부와 범위가 관점에 따라 갈린다.", "deg": 55}, {"n": "정격(10정격)", "L": 5, "k": 12, "big": "S08 강약·격국·구조", "mid": "격국", "code": "S08", "col": "#4a86e8", "p": 38, "au": 8, "d": "정제", "q": "월지의 지장간 가운데 천간으로 드러난 십성으로 격을 잡는 열 가지 표준 틀. 대부분의 사주가 여기 든다.", "deg": 36}, {"n": "고립·병존 구조", "L": 5, "k": 13, "big": "S08 강약·격국·구조", "mid": "구조·상태", "code": "S08", "col": "#4a86e8", "p": 878, "au": 15, "d": "정제", "q": "한 글자가 홀로 떨어져 도움을 못 받거나(고립), 같은 글자가 나란히 몰려 있는(병존) 짜임. 기운의 쏠림을 판단하는 실마리가 된다.", "deg": 66}, {"n": "조후 균형", "L": 5, "k": 14, "big": "S08 강약·격국·구조", "mid": "구조·상태", "code": "S08", "col": "#4a86e8", "p": 289, "au": 15, "d": "정제", "q": "사주가 춥고 더움, 마르고 젖음에서 치우치지 않았는지를 보는 것. 태어난 계절이 기준이 되며 억부와 별개의 축이다.", "deg": 67}, {"n": "청탁", "L": 5, "k": 15, "big": "S08 강약·격국·구조", "mid": "구조·상태", "code": "S08", "col": "#4a86e8", "p": 97, "au": 12, "d": "정제", "q": "사주의 짜임이 맑은지 탁한지를 보는 것. 기운이 서로 어긋나지 않고 흐름이 통하면 맑다고 본다.", "deg": 26}, {"n": "억부용신", "L": 5, "k": 16, "big": "S09 용신", "mid": "용신 5법", "code": "S09", "col": "#6c6ce0", "p": 429, "au": 14, "d": "정제", "q": "강한 것은 누르고 약한 것은 도와 균형을 맞추는 방식으로 잡는 용신. 신강·신약 판정이 먼저 서야 한다.", "deg": 69}, {"n": "한난조습", "L": 5, "k": 17, "big": "S09 용신", "mid": "용신 5법", "code": "S09", "col": "#6c6ce0", "p": 183, "au": 14, "d": "정제", "q": "글자와 원국을 차고 더움(한난)·마르고 축축함(조습) 두 축으로 보는 틀. 조후에서 치우침을 재는 자로 쓰며, 치우치면 그 반대쪽 오행을 끌어와 맞춘다.", "deg": 57}, {"n": "통관용신", "L": 5, "k": 18, "big": "S09 용신", "mid": "용신 5법", "code": "S09", "col": "#6c6ce0", "p": 142, "au": 12, "d": "정제", "q": "맞서 싸우는 두 기운 사이에 끼어 다리를 놓아주는 오행으로 잡는 용신.", "deg": 66}, {"n": "병약용신", "L": 5, "k": 19, "big": "S09 용신", "mid": "용신 5법", "code": "S09", "col": "#6c6ce0", "p": 84, "au": 11, "d": "정제", "q": "사주를 병들게 하는 글자를 먼저 찾고, 그 병을 고치는 글자를 용신으로 삼는 방식.", "deg": 61}, {"n": "조후용신", "L": 5, "k": 20, "big": "S09 용신", "mid": "용신 5법", "code": "S09", "col": "#6c6ce0", "p": 79, "au": 12, "d": "정제", "q": "춥고 더움, 마르고 젖음을 고르게 만드는 방식으로 잡는 용신. 태어난 계절이 판단의 축이다.", "deg": 37}, {"n": "전왕용신", "L": 5, "k": 21, "big": "S09 용신", "mid": "용신 5법", "code": "S09", "col": "#6c6ce0", "p": 13, "au": 4, "d": "정제", "q": "한쪽으로 완전히 치우친 사주에서 그 치우친 오행을 그대로 용신으로 삼는 방식.", "deg": 10}, {"n": "구신·한신", "L": 5, "k": 22, "big": "S09 용신", "mid": "운용", "code": "S09", "col": "#6c6ce0", "p": 702, "au": 14, "d": "정제", "q": "기신을 돕는 오행이 구신, 이롭지도 해롭지도 않은 오행이 한신이다.", "deg": 61}, {"n": "기신", "L": 5, "k": 23, "big": "S09 용신", "mid": "운용", "code": "S09", "col": "#6c6ce0", "p": 426, "au": 17, "d": "정제", "q": "용신을 해쳐 사주를 불리하게 만드는 오행. 이 기운이 오는 시기를 조심스럽게 본다.", "deg": 58}, {"n": "희신", "L": 5, "k": 24, "big": "S09 용신", "mid": "운용", "code": "S09", "col": "#6c6ce0", "p": 341, "au": 13, "d": "정제", "q": "용신을 도와 힘을 실어주는 오행. 용신 다음으로 반기는 기운이다.", "deg": 81}, {"n": "용신 확정법", "L": 5, "k": 25, "big": "S09 용신", "mid": "운용", "code": "S09", "col": "#6c6ce0", "p": 49, "au": 7, "d": "정제", "q": "용신을 실제로 정하는 절차. 원국만으로는 후보까지만 좁히고, 살아온 이력과 운의 흐름을 맞춰 봐야 확정된다.", "deg": 50}, {"n": "용신 회의론", "L": 5, "k": 26, "big": "S09 용신", "mid": "운용", "code": "S09", "col": "#6c6ce0", "p": 3, "au": 3, "d": "정제", "q": "용신을 주요 관법으로 채택하지 않는 관점. 사람마다 답이 갈리고 삶의 결과를 설명하지 못한다는 이유를 든다.", "deg": 1}, {"n": "순행·역행", "L": 6, "k": 0, "big": "S10 대운·세운·운해석", "mid": "운 계산", "code": "S10", "col": "#9159d1", "p": 195, "au": 15, "d": "정제", "q": "대운이 월주에서 앞으로 나아가느냐 거꾸로 가느냐. 연간의 음양과 성별 조합으로 방향이 정해진다.", "deg": 47}, {"n": "교운기", "L": 6, "k": 1, "big": "S10 대운·세운·운해석", "mid": "운 계산", "code": "S10", "col": "#9159d1", "p": 116, "au": 14, "d": "정제", "q": "대운이 바뀌는 무렵의 어수선한 구간. 앞뒤 몇 해에 걸쳐 두 기운이 겹친다.", "deg": 21}, {"n": "대운수", "L": 6, "k": 2, "big": "S10 대운·세운·운해석", "mid": "운 계산", "code": "S10", "col": "#9159d1", "p": 70, " const COLW = 262, PADX = 195, PADY = 138, ROWMIN = 21;

const collapsed = new Array(F.length).fill(false);

function layout(){
  const colX = [];
  let x = PADX;
  for(let i=0;i<F.length;i++){ colX.push(x); x += collapsed[i] ? 96 : COLW; }
  D.colX = colX; D.totalW = x + PADX;
  for(const n of N){
    const cnt = F[n.L].n;
    const span = collapsed[n.L] ? 0 : Math.min(layH, cnt*ROWMIN);
    n.x = colX[n.L];
    n.y = PADY + (cnt<=1 ? span/2 : (n.k/(cnt-1))*span) + (layH-span)/2;
    n.r = collapsed[n.L] ? 0 : Math.max(2.1, Math.min(7.5, 1.7+Math.log10(1+n.p)*1.55));
  }
  D.totalH = PADY + layH + 90;
}
layout();

// ── 뷰
let vx=0, vy=0, vs=1;
function fit(){
  if(W<2||H<2) return;
  vs = Math.min(W/D.totalW, H/D.totalH)*0.94;
  vx = (W - D.totalW*vs)/2; vy = (H - D.totalH*vs)/2;
  draw();
}
function toS(p){ return {x:p.x*vs+vx, y:p.y*vs+vy}; }

// ── 상태
const tierOn = [true,true,true,false,true];

const ADJ = N.map(()=>[]);

function edgeVisible(e){
  if(!tierOn[e[2]]) return false;
  if(e[3] < wmin) return false;
  const a=N[e[0]], b=N[e[1]];
  if(!bigOn[a.code] || !bigOn[b.code]) return false;
  if(collapsed[a.L] || collapsed[b.L]) return false;
  if(fwdOnly && a.L > b.L) return false;
  return true;
}
function nodeVisible(n){ return bigOn[n.code] && !collapsed[n.L]; }

// ── 그리기
function curve(a,b){
  const A=toS(a), B=toS(b);
  const dx = B.x-A.x, dy = B.y-A.y;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  if(Math.abs(dx) < 6){                      // 같은 층 → 옆으로 부풀린다
    const bow = Math.min(190, 42+Math.abs(dy)*0.42)*vs;
    ctx.bezierCurveTo(A.x+bow, A.y+dy*0.18, B.x+bow, B.y-dy*0.18, B.x, B.y);

    const c = Math.abs(dx)*0.55;
    ctx.bezierCurveTo(A.x+c, A.y, B.x-c, B.y, B.x, B.y);
  }
  ctx.stroke();
}

  for(const n of N){
    if(!nodeVisible(n)) continue;
    const P=toS(n), r=Math.max(1.6, n.r*vs);
    const dim = focSet && !focSet.has(N.indexOf(n)) && N.indexOf(n)!==foc;
    ctx.globalAlpha = dim ? 0.13 : 1;
    if(!dim){
      ctx.beginPath(); ctx.arc(P.x,P.y,r*2.5,0,6.284);
      ctx.fillStyle = n.col+'22'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(P.x,P.y,r,0,6.284);
    ctx.fillStyle = n.col; ctx.fill();
    if(n.d==='공백'){ ctx.strokeStyle='#e0483f'; ctx.lineWidth=1.2; ctx.stroke(); }
    ctx.globalAlpha=1;
  }

  // 이름 — 층마다 화면 간격을 재서, 겹칠 층은 접어둔다(포커스된 것만 남김)
  const gapOK = F.map((f,i)=>{
    const span = collapsed[i] ? 0 : Math.min(layH, f.n*ROWMIN);
    return f.n<=1 ? 999 : (span/(f.n-1))*vs;
  });
  if(showLbl){
    ctx.font = `${Math.max(8.5, 10.5*Math.min(1.35,vs))}px "Pretendard","Malgun Gothic",sans-serif`;
    ctx.textBaseline='middle';
    for(const n of N){
      if(!nodeVisible(n)) continue;
      const ni=N.indexOf(n);
      const dim = focSet && !focSet.has(ni) && ni!==foc;
      const near = foc!=null && (ni===foc || (focSet && focSet.has(ni)));
      if(gapOK[n.L] < 12.5 && !near) continue;    // 겹칠 자리면 생략 — 줌인하면 나타난다
      if(dim && vs<1.1) continue;
      const P=toS(n);
      ctx.globalAlpha = dim?0.16:(foc!=null&&(ni===foc)?1:0.82);
      ctx.fillStyle = (foc!=null&&ni===foc)?'#fff':'#9fb6d4';
      ctx.textAlign='left';
      ctx.fillText(n.n, P.x + Math.max(3,n.r*vs)+5, P.y);
      ctx.globalAlpha=1;
    }
  }

  // 층 머리
  for(let i=0;i<F.length;i++){
    const x=D.colX[i]*vs+vx, y=(PADY-74)*vs+vy;
    const f=F[i];
    const k=Math.min(1.2,vs), bw=176*k, bh=52*k;
    ctx.strokeStyle = collapsed[i]?'rgba(60,78,110,.55)':'rgba(90,140,220,.42)';
    ctx.lineWidth=1; ctx.fillStyle='rgba(8,14,28,.72)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x-14, y-7, bw, bh, 5*k);
    else ctx.rect(x-14, y-7, bw, bh);
    ctx.fill(); ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font=`bold ${Math.max(10,12.5*Math.min(1.2,vs))}px "Pretendard",sans-serif`;
    ctx.fillStyle = collapsed[i] ? '#4b5c74' : '#7fb0ff';
    ctx.fillText(f.name, x-8, y);
    ctx.font=`${Math.max(9,11*Math.min(1.2,vs))}px "Pretendard",sans-serif`;
    ctx.fillStyle='#5b6f8f'; ctx.fillText('개념: '+f.n, x-8, y+17*Math.min(1.2,vs));
    ctx.fillStyle = collapsed[i]?'#5b6f8f':'#e8508f';
    ctx.fillText(f.sub+'  (클릭)', x-8, y+32*Math.min(1.2,vs));
    f._hit = {x:x-14, y:y-7, w:bw, h:bh};
  }
}

// ── 히트 테스트
function pick(mx,my){
  let best=null, bd=15;
  for(let i=0;i<N.length;i++){
    const n=N[i]; if(!nodeVisible(n)) continue;
    const P=toS(n), d=Math.hypot(P.x-mx,P.y-my);
    if(d < Math.max(7, n.r*vs+5) && d<bd){ bd=d; best=i; }
  }
  return best;
}

// ── 정보 패널
const info=document.getElementById('info');
function showInfo(i){
  if(i==null){ info.style.display='none'; return; }
  const n=N[i];
  const mine = ADJ[i].map(k=>E[k]).filter(edgeVisible);
  const grp = [[],[],[],[],[]];
  for(const e of mine){
    const other = e[0]===i ? e[1] : e[0];
    grp[e[2]].push({o:other, w:e[3], k:e[4], lf:e[5], p:e[6], out:e[0]===i});
  }
  let h = `<h2>${n.n}</h2><div class="path">${n.big} › ${n.mid} · ${F[n.L].name}</div>`;
  if(n.q) h += `<div class="def">${n.q}</div>`;
  else h += `<div class="def" style="border-color:#e0483f;color:#e8a0a0">정의 공백 — 저자가 «무엇이다»라고 말한 문장이 없다<span class="who">근거는 ${n.p.toLocaleString()}문단 있다</span></div>`;
  h += `<div class="row"><span class="nm">문단</span><span class="meta">${n.p.toLocaleString()}</span></div>`;
  h += `<div class="row"><span class="nm">저자</span><span class="meta">${n.au}명</span></div>`;
  h += `<div class="row"><span class="nm">시냅스</span><span class="meta">${n.deg}개</span></div>`;
  for(const t of [0,1,2,3,4]){
    if(!grp[t].length) continue;
    grp[t].sort((a,b)=>b.w-a.w || b.lf-a.lf);
    h += `<div class="sec" style="color:${TIERS[t].col}">${TIERS[t].name} — ${grp[t].length}</div>`;
    for(const g of grp[t].slice(0,26)){
      const o=N[g.o];
      const meta = t===0 ? `${g.out?'→':'←'} ${g.k} · ${g.w}`
                         : `×${(+g.lf).toFixed(1)} · ${g.p}문단`;
      h += `<div class="row"><span class="nm" style="color:${o.col}">●</span>`+
           `<span class="nm">${o.n}</span><span class="meta">${o.code} · ${meta}</span></div>`;
    }
    if(grp[t].length>26) h += `<div class="row"><span class="meta">… 외 ${grp[t].length-26}개</span></div>`;
  }
  info.innerHTML=h; info.style.display='block';
}

// ── 이벤트
const tip=document.getElementById('tip');
let dragging=false, sx=0, sy=0, moved=false;
cv.addEventListener('mousedown',e=>{dragging=true;moved=false;sx=e.clientX;sy=e.clientY;cv.classList.add('drag')});
addEventListener('mouseup',()=>{dragging=false;cv.classList.remove('drag')});
cv.addEventListener('mousemove',e=>{
  if(dragging){
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    vx+=dx; vy+=dy; sx=e.clientX; sy=e.clientY; draw(); return;
  }
  const i=pick(e.clientX,e.clientY);
  if(i!==hover){ hover=i; draw(); if(lock==null) showInfo(i); }
  if(i!=null){
    const n=N[i];
    tip.style.display='block';
    tip.style.left=(e.clientX+13)+'px'; tip.style.top=(e.clientY+13)+'px';
    tip.innerHTML=`<b>${n.n}</b> <span style="color:#6d82a3">${n.code}·${n.mid}</span><br>`+
      `<span style="color:#6d82a3">문단 ${n.p.toLocaleString()} · 시냅스 ${n.deg}</span>`;
  } else tip.style.display='none';
});
cv.addEventListener('click',e=>{
  if(moved) return;
  for(let i=0;i<F.length;i++){
    const r=F[i]._hit;
    if(r && e.clientX>=r.x && e.clientX<=r.x+r.w && e.clientY>=r.y && e.clientY<=r.y+r.h){
      collapsed[i]=!collapsed[i]; layout(); draw(); return;
    }
  }
  const i=pick(e.clientX,e.clientY);
  lock = (i!=null && i!==lock) ? i : null;
  showInfo(lock!=null?lock:hover); draw();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0013), nx=Math.max(0.12,Math.min(7,vs*f));
  vx = e.clientX-(e.clientX-vx)*(nx/vs); vy = e.clientY-(e.clientY-vy)*(nx/vs);
  vs=nx; draw();
},{passive:false});

// ── 컨트롤
const tierBox=document.getElementById('tierBox');
TIERS.forEach(t=>{
  const cnt=E.filter(e=>e[2]===t.i).length;
  const l=document.createElement('label');
  l.innerHTML=`<input type="checkbox" ${tierOn[t.i]?'checked':''}>
    <span class="sw" style="background:${t.col}"></span>${t.name}<span class="cnt">${cnt}</span>`;
  l.title=t.desc;
  l.querySelector('input').onchange=ev=>{tierOn[t.i]=ev.target.checked;draw()};
  tierBox.appendChild(l);
});
const bigBox=document.getElementById('bigBox');
const bigNames={};
N.forEach(n=>bigNames[n.code]=n.big);
Object.keys(D.pal).sort().forEach(code=>{
  if(!bigNames[code]) return;
  const cnt=N.filter(n=>n.code===code).length;
  const l=document.createElement('label');
  l.innerHTML=`<input type="checkbox" checked><span class="sw" style="background:${D.pal[code]}"></span>${bigNames[code].replace(/^S\d+ /,'')}<span class="cnt">${cnt}</span>`;
  l.querySelector('input').onchange=ev=>{bigOn[code]=ev.target.checked;draw()};
  bigBox.appendChild(l);
});
document.getElementById('nN').textContent=N.length;
document.getElementById('eN').textContent=E.length.toLocaleString();
document.getElementById('wmin').oninput=e=>{wmin=+e.target.value;
  document.getElementById('wv').textContent=wmin.toFixed(2);draw()};
document.getElementById('lbl').onchange=e=>{showLbl=e.target.checked;draw()};
document.getElementById('glow').onchange=e=>{glow=e.target.checked;draw()};
document.getElementById('fwd').onchange=e=>{fwdOnly=e.target.checked;draw()};
document.getElementById('fit').onclick=fit;
document.getElementById('reset').onclick=()=>{lock=null;hover=null;showInfo(null);draw()};

function resize(){
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  draw();
}
addEventListener('resize',()=>{resize();});
resize(); fit();
</script></body></html>
